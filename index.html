
<!DOCTYPE html>
<html>
<head>
    <title>Pretty Pink Cashier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="kasir">
    <h1>🦋 Pretty Cashier</h1>
    <p class="sub">♡ Selamat Datang di Toko Kami ♡</p>

    <h3>🌷 Detail Belanja</h3>

    <input type="text" id="barang"
    placeholder="Nama barang">

    <input type="number" id="harga"
    placeholder="Harga barang (Rp)">

    <input type="number" id="jumlah"
    placeholder="Jumlah barang">

    <button onclick="hitung()">💗 Hitung Total</button>

    <div class="hasil">
        <h3 id="total">Total Belanja: Rp0</h3>
    </div>

    <h3>🎀 Pembayaran</h3>

    <input type="number" id="bayar"
    placeholder="Masukkan uang pembayaran">

    <button onclick="kembalian()">✨ Hitung Kembalian</button>

    <div class="hasil">
        <h3 id="hasil">Kembalian: Rp0</h3>
    </div>

    <p class="footer">Terima Kasih Sudah Berbelanja 💕</p>
</div>

<script src="script.js"></script>

</body>
                          </html>
